[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualflare-pytest"
version = "0.1.2"
description = "Native pytest plugin for Qualflare — results, per-attempt retry history, flakiness, steps and attachments, with pytest-xdist support."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Qualflare" }]
keywords = ["qualflare", "pytest", "pytest-plugin", "test-reporter", "test-reporting", "test-results", "flaky-tests"]
classifiers = [
  "Framework :: Pytest",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
# pytest is the only hard requirement. pytest-xdist and pytest-rerunfailures are
# supported but optional -- the plugin must work, and be tested, without them.
dependencies = ["pytest>=7.0"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-xdist>=3.0",
  "pytest-rerunfailures>=12.0",
  "pytest-bdd>=7.0",
  "mypy>=1.8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://qualflare.com/pytest-test-reporting/"
Issues = "https://github.com/Qualflare/qualflare-pytest/issues"
Repository = "https://github.com/Qualflare/qualflare-pytest"

# This is what makes pytest load the plugin automatically on install.
[project.entry-points.pytest11]
qualflare = "qualflare_pytest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/qualflare_pytest"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# The RUNTIME floor is 3.9 (see requires-python); mypy itself no longer accepts
# a 3.9 target, so the type check runs against 3.10 semantics. The CI matrix is
# what actually proves 3.9 works.
python_version = "3.10"
strict = true
files = ["src/qualflare_pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
